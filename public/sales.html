<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المبيعات | نقطة البيع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/cashier.html"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">نقطة البيع</span></a>
    <nav class="nav" aria-label="التنقل الرئيسي">
      <a href="/cashier.html">الكاشير</a>
      <a href="/">المنتجات</a>
      <a href="/sales.html" aria-current="page">المبيعات</a>
    </nav>
  </header>

  <main class="sales">
    <div class="sales-head">
      <h1>المبيعات</h1>
      <div class="segmented" role="group" aria-label="عرض المبيعات حسب">
        <button type="button" data-mode="day" aria-pressed="true">يوم</button>
        <button type="button" data-mode="month" aria-pressed="false">شهر</button>
        <button type="button" data-mode="range" aria-pressed="false">فترة</button>
      </div>
    </div>

    <div class="period-bar">
      <div class="period-controls" data-panel="day">
        <button class="btn btn-sm" id="prevDay" type="button">اليوم السابق</button>
        <input class="input" id="dayInput" type="date" aria-label="اليوم">
        <button class="btn btn-sm" id="nextDay" type="button">اليوم التالي</button>
        <button class="btn btn-sm btn-ghost" id="todayBtn" type="button">اليوم</button>
      </div>
      <div class="period-controls" data-panel="month" hidden>
        <button class="btn btn-sm" id="prevMonth" type="button">الشهر السابق</button>
        <input class="input" id="monthInput" type="month" aria-label="الشهر">
        <button class="btn btn-sm" id="nextMonth" type="button">الشهر التالي</button>
        <button class="btn btn-sm btn-ghost" id="thisMonthBtn" type="button">هذا الشهر</button>
      </div>
      <form class="period-controls" data-panel="range" id="rangeForm" hidden>
        <label>من <input class="input" id="fromInput" type="date"></label>
        <label>إلى <input class="input" id="toInput" type="date"></label>
        <button class="btn btn-sm btn-primary" type="submit">عرض</button>
        <span class="presets">
          <button class="btn btn-sm btn-ghost" type="button" data-preset="7">آخر 7 أيام</button>
          <button class="btn btn-sm btn-ghost" type="button" data-preset="30">آخر 30 يومًا</button>
          <button class="btn btn-sm btn-ghost" type="button" data-preset="year">هذه السنة</button>
        </span>
      </form>
    </div>

    <h2 class="period-title" id="periodTitle"></h2>
    <div class="zreport" id="summary"></div>
    <div id="salesArea"></div>

    <section class="report-section" id="productsSection" aria-labelledby="productsTitle" hidden>
      <div class="section-head">
        <h2 id="productsTitle">المنتجات</h2>
        <div class="segmented segmented-sm" role="group" aria-label="ترتيب المنتجات">
          <button type="button" data-sort="profit" aria-pressed="true">الأكثر ربحًا</button>
          <button type="button" data-sort="total" aria-pressed="false">الأعلى مبيعات</button>
          <button type="button" data-sort="quantity" aria-pressed="false">الأكثر قطعًا</button>
        </div>
      </div>
      <div id="productsArea"></div>
    </section>
  </main>

  <dialog class="dialog return-dialog" id="returnDialog" aria-labelledby="returnTitle">
    <form id="returnForm" novalidate>
      <h2 id="returnTitle"></h2>
      <p class="hint">حدّد عدد القطع التي أعادها الزبون من كل صنف. يُعاد ثمنها إليه وتعود القطع إلى المخزن.</p>
      <table class="ptable return-table">
        <thead><tr>
          <th scope="col">الصنف</th>
          <th scope="col">المباع</th>
          <th scope="col">الكمية المرتجعة</th>
        </tr></thead>
        <tbody id="returnLines"></tbody>
      </table>
      <div class="return-total">
        <span>المبلغ الذي يُعاد للزبون</span>
        <strong class="num" id="returnAmount">0</strong>
      </div>
      <p class="form-error" id="returnError" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="btn btn-primary" type="submit">تأكيد الإرجاع</button>
        <button class="btn" type="button" id="returnAllBtn">إرجاع الكل</button>
        <button class="btn btn-ghost" type="button" id="returnCloseBtn">إغلاق</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="/js/sales.js"></script>
</body>
</html>
