<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنتجات | نقطة البيع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell">
  <header class="topbar">
    <a class="brand" href="/cashier.html"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">نقطة البيع</span></a>
    <nav class="nav" aria-label="التنقل الرئيسي">
      <a href="/cashier.html">الكاشير</a>
      <a href="/" aria-current="page">المنتجات</a>
      <a href="/sales.html">المبيعات</a>
    </nav>
  </header>

  <main class="catalog">
    <aside class="rail" aria-labelledby="railTitle">
      <h2 id="railTitle">الأقسام</h2>
      <form class="rail-add" id="categoryForm" autocomplete="off">
        <input class="input" name="name" placeholder="اسم قسم جديد" maxlength="60" aria-label="اسم قسم جديد">
        <button class="btn btn-primary" type="submit">إضافة</button>
      </form>
      <ul class="rail-list" id="categoryList"></ul>
    </aside>

    <section class="catalog-main" aria-labelledby="catalogTitle">
      <div class="catalog-head">
        <div>
          <h1 id="catalogTitle">كل المنتجات</h1>
          <span class="catalog-count" id="catalogCount"></span>
        </div>
        <div class="catalog-tools">
          <input class="input search" id="searchInput" type="search" placeholder="ابحث بالاسم أو الباركود" aria-label="بحث في المنتجات">
          <button class="btn btn-primary" id="addProductBtn" type="button">إضافة منتج</button>
        </div>
      </div>
      <div class="table-wrap" id="productsArea"></div>
    </section>
  </main>

  <dialog class="dialog" id="productDialog" aria-labelledby="productDialogTitle">
    <form id="productForm" novalidate autocomplete="off">
      <h2 id="productDialogTitle">منتج جديد</h2>
      <div class="field">
        <label for="fBarcode">رمز الباركود</label>
        <div class="input-group">
          <input class="input num" id="fBarcode" name="barcode" maxlength="64" spellcheck="false">
          <button class="btn" type="button" id="cameraScanBtn" title="مسح الباركود بالكاميرا">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>
            <span class="btn-label">الكاميرا</span>
          </button>
          <button class="btn" type="button" id="genBarcodeBtn">توليد رمز</button>
        </div>
        <p class="hint">امسح الباركود بالقارئ أو بالكاميرا، أو اكتبه. إن لم يكن للمنتج باركود اضغط «توليد رمز».</p>
      </div>
      <div class="field">
        <label for="fName">اسم المنتج</label>
        <input class="input" id="fName" name="name" maxlength="120">
      </div>
      <div class="field">
        <label for="fCategory">القسم</label>
        <select class="input" id="fCategory" name="category"></select>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fPurchase">سعر الشراء</label>
          <input class="input num" id="fPurchase" name="purchasePrice" type="number" min="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="fSale">سعر البيع</label>
          <input class="input num" id="fSale" name="salePrice" type="number" min="0" step="any" inputmode="decimal">
        </div>
      </div>
      <p class="margin-note" id="marginNote" aria-live="polite"></p>
      <p class="form-error" id="productError" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="btn btn-primary" type="submit" value="close">حفظ</button>
        <button class="btn" type="submit" value="next" id="saveNextBtn">حفظ وإضافة آخر</button>
        <button class="btn btn-ghost" type="button" id="cancelProductBtn">إلغاء</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="/js/products.js"></script>
</body>
</html>
