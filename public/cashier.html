<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الكاشير | نقطة البيع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell">
  <header class="topbar">
    <a class="brand" href="/cashier.html"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">نقطة البيع</span></a>
    <nav class="nav" aria-label="التنقل الرئيسي">
      <a href="/cashier.html" aria-current="page">الكاشير</a>
      <a href="/">المنتجات</a>
      <a href="/sales.html">المبيعات</a>
    </nav>
    <div class="topbar-meta" id="todayStats"></div>
  </header>

  <main class="register">
    <section class="shelf" aria-label="المنتجات">
      <div class="scan">
        <label for="scanInput" class="sr-only">الباركود أو اسم المنتج</label>
        <svg class="scan-icon" viewBox="0 0 24 20" aria-hidden="true"><path fill="currentColor" d="M1 1h2v18H1zM5 1h1v18H5zM8 1h3v18H8zM13 1h1v18h-1zM16 1h2v18h-2zM20 1h1v18h-1zM22 1h1v18h-1z"/></svg>
        <input id="scanInput" class="scan-input" placeholder="امسح الباركود أو اكتب اسم المنتج" autocomplete="off" spellcheck="false" autofocus>
        <button class="scan-camera" id="cameraBtn" type="button" title="المسح بكاميرا الجهاز">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>
          <span class="btn-label">الكاميرا</span>
        </button>
      </div>
      <div class="chips" id="chips" aria-label="الأقسام"></div>
      <div class="tiles" id="tiles"></div>
    </section>

    <aside class="counter" aria-label="الفاتورة">
      <div class="receipt-shadow">
        <div class="receipt">
          <div class="receipt-head">
            <strong>فاتورة جديدة</strong>
            <span class="receipt-clock" id="clock"></span>
          </div>
          <ol class="receipt-lines" id="cartLines" hidden></ol>
          <div class="receipt-empty" id="cartEmpty">
            <p>امسح باركود المنتج أو اضغط عليه ليُضاف إلى الفاتورة.</p>
          </div>
          <dl class="receipt-sum">
            <div class="sum-row"><dt>عدد القطع</dt><dd class="num" id="itemCount">0</dd></div>
            <div class="sum-row grand"><dt>الإجمالي</dt><dd class="num" id="grandTotal">0</dd></div>
          </dl>
          <div class="pay">
            <label for="paidInput">المدفوع</label>
            <input id="paidInput" class="input pay-input num" type="number" min="0" step="any" inputmode="decimal" placeholder="المبلغ بالضبط">
            <div class="sum-row change" id="changeRow">
              <span id="changeLabel">الباقي للزبون</span>
              <strong class="num" id="changeDue">0</strong>
            </div>
          </div>
        </div>
      </div>
      <div class="register-actions">
        <button class="btn btn-go btn-xl" id="checkoutBtn" type="button" disabled>إتمام البيع</button>
        <button class="btn btn-ghost" id="clearBtn" type="button" disabled>إلغاء الفاتورة</button>
      </div>
      <p class="keys-hint">
        <span><kbd>Enter</kbd> بعد المسح يضيف المنتج</span>
        <span><kbd>3*</kbd> قبل الباركود لإضافة 3 قطع</span>
        <span><kbd>F2</kbd> للانتقال إلى المدفوع، ثم <kbd>Enter</kbd> لإتمام البيع</span>
      </p>
    </aside>
  </main>

  <dialog class="dialog sale-dialog" id="saleDialog" aria-label="إيصال البيع">
    <div class="printable" id="saleReceipt"></div>
    <div class="dialog-actions">
      <button class="btn btn-primary" id="newSaleBtn" type="button">فاتورة جديدة</button>
      <button class="btn" id="printBtn" type="button">طباعة الإيصال</button>
      <button class="btn btn-ghost danger" id="cancelSaleBtn" type="button">إلغاء البيع وإرجاع المبلغ</button>
    </div>
  </dialog>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="/js/cashier.js"></script>
</body>
</html>
