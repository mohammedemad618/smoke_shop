<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C2530">
  <title>الجرد | نقطة البيع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/cashier.html"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">نقطة البيع</span></a>
    <nav class="nav" aria-label="التنقل الرئيسي">
      <a href="/cashier.html">الكاشير</a>
      <a href="/" aria-current="page">المنتجات</a>
      <a href="/sales.html">المبيعات</a>
      <a href="/expenses.html">المصاريف</a>
      <a href="/debts.html">الديون</a>
    </nav>
  </header>

  <main class="sales stocktake">
    <div class="sales-head">
      <div>
        <a class="back-link" href="/">المنتجات</a>
        <h1>الجرد</h1>
      </div>
      <div class="head-actions" id="headActions"></div>
    </div>
    <div id="view"><p class="hint">جارٍ التحميل…</p></div>
  </main>

  <dialog class="dialog" id="countDialog" aria-labelledby="countTitle">
    <form id="countForm" novalidate autocomplete="off">
      <h2 id="countTitle"></h2>
      <p class="count-meta" id="countMeta"></p>
      <dl class="count-facts">
        <div><dt>المسجّل في النظام</dt><dd id="countExpected"></dd></div>
        <div id="countPrevRow"><dt>عددته سابقًا</dt><dd><span id="countPrev"></span> <button class="link-btn" type="button" id="countRemove">إزالة العدّ</button></dd></div>
      </dl>
      <div class="field">
        <label for="countInput" id="countLabel"></label>
        <input class="input num count-input" id="countInput" type="number" min="0">
      </div>
      <label class="check" id="countAddRow"><input type="checkbox" id="countAdd"> أضف إلى العدد السابق (المنتج في أكثر من مكان)</label>
      <p class="margin-note" id="countDiff" aria-live="polite"></p>
      <p class="form-error" id="countError" role="alert" hidden></p>
      <div class="dialog-actions" id="countActions">
        <button class="btn btn-primary" type="submit" value="save" id="countSave">حفظ</button>
        <button class="btn" type="submit" value="next" id="countNext">حفظ ومسح التالي</button>
        <button class="btn btn-ghost" type="button" data-close>إلغاء</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="applyDialog" aria-labelledby="applyTitle">
    <form id="applyForm">
      <h2 id="applyTitle">اعتماد الجرد</h2>
      <ul class="apply-list" id="applySummary"></ul>
      <p class="hint">بعد الاعتماد تُصحَّح كميات المنتجات المعدودة ويُحفظ الجرد في السجل، ولا يمكن التراجع عنه.</p>
      <div class="dialog-actions">
        <button class="btn btn-go" type="submit" id="applyConfirm">اعتماد وتصحيح الكميات</button>
        <button class="btn btn-ghost" type="button" data-close>رجوع</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog history-dialog" id="historyDialog" aria-labelledby="historyTitle">
    <div class="history-body" id="historyBody"></div>
    <div class="dialog-actions history-actions">
      <button class="btn btn-ghost" type="button" data-close>إغلاق</button>
    </div>
  </dialog>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="/js/stocktake.js"></script>
</body>
</html>
