# /etc/nginx/snippets/pos-proxy.conf: how every POS location reaches the app (sites-available/pos)
#
# The app finds the shop from the Host header alone (lib/tenancy.js), so Host is passed as
# the browser sent it, and the headers a client could use to name another host are emptied
# (an empty value drops the header). X-Forwarded-For is replaced, not appended to, so the
# address the app sees for sign-in limits is the one nginx saw. No add_header here: a
# location with its own add_header would lose the server's HSTS header.

proxy_pass http://pos_app;
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host "";
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Request-Id $request_id;

proxy_redirect off;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
