# /etc/nginx/sites-available/pos  (enabled by a link in sites-enabled/pos)
#
# The POS shops (<slug>.pos.108-61-190-4.sslip.io) and the admin panel
# (admin.pos.108-61-190-4.sslip.io), in front of the app on 127.0.0.1:3401 (pos.service).
# Every name defined here starts with pos_, and nothing here changes another site:
# - no default_server: niura keeps the default servers on 80 and 443 (its ssl_reject_handshake
#   still answers every name nobody serves);
# - no reuseport and no ssl_session_cache: both are shared by every server on the same
#   address and port, so setting them here would change the other sites;
# - the listen lines copy niura's form exactly (IPv4 and [::], "ssl http2" on nginx 1.24).
#
# Certificates: one Let's Encrypt certificate per host, issued by pos-root-worker into
# /etc/nginx/pos-certs/<host>/. The path holds a variable, so nginx reads the files at each
# TLS handshake: `nginx -t` passes before any certificate exists, and an issued or renewed
# certificate is used at once, with no reload. A name without a certificate (or any name the
# map refuses: "none") fails the handshake, which is what a shop still being set up should do.
#
# Server names: the shops use the wildcard *.pos.108-61-190-4.sslip.io rather than a regular
# expression. nginx picks an exact name first, then the longest wildcard, and only then the
# first matching expression, so no other site's wildcard or expression can take these names.
# The admin name is exact, so it beats the shops' wildcard.

# The certificate directory of the name the browser asked for (SNI). Same pattern as the
# root worker's host check and lib/slug.js (3 to 30 characters); the admin name matches too.
map $ssl_server_name $pos_cert {
    "~^[a-z][a-z0-9-]{1,28}[a-z0-9]\.pos\.108-61-190-4\.sslip\.io$" $ssl_server_name;
    default "none";
}

# Sign-in endpoints: per client address
limit_req_zone $binary_remote_addr zone=pos_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pos_admin_auth:1m rate=5r/m;
# Everything else: per shop host, all its devices together
limit_req_zone $host zone=pos_host:10m rate=30r/s;
limit_conn_zone $host zone=pos_conn:1m;

# The app. One server, so nginx never marks it down; a few kept-alive connections save a TCP
# handshake per request. Node closes an idle connection after 5 s (server.keepAliveTimeout),
# so nginx must drop it first: a POST sent on a connection Node is closing at that moment
# would get a 502, and nginx does not retry a POST on another connection.
upstream pos_app {
    server 127.0.0.1:3401;
    keepalive 8;
    keepalive_timeout 4s;
}

# Port 80, our names only: Let's Encrypt's HTTP-01 challenge, the worker's probe, and a
# redirect to HTTPS for everything else. niura's default server answers every other name.
server {
    listen 80;
    listen [::]:80;
    server_name *.pos.108-61-190-4.sslip.io;

    access_log /var/log/nginx/pos.access.log;
    error_log /var/log/nginx/pos.error.log warn;
    server_tokens off;

    # pos-root-worker asks for this before calling certbot: if it does not come back, Let's
    # Encrypt would not reach the challenge either, and a failed validation would count
    # against the hourly limit for that name
    location = /.well-known/acme-challenge/pos-probe {
        default_type text/plain;
        return 200 "pos-ok\n";
    }

    # certbot --webroot -w /var/www/letsencrypt writes the challenge files here (the same
    # webroot niura uses; certbot only adds and removes its own token files)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The shops
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.pos.108-61-190-4.sslip.io;

    ssl_certificate /etc/nginx/pos-certs/$pos_cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/pos-certs/$pos_cert/privkey.pem;

    # No includeSubDomains: sslip.io names belong to everyone
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/pos.access.log;
    error_log /var/log/nginx/pos.error.log warn;
    server_tokens off;
    client_max_body_size 256k;

    # Over HTTP/2 every request in flight counts as a connection here, and one page load
    # already asks for about ten files and API calls at once (the summary page alone sends six
    # API calls together): 24 per shop leaves room for a few devices, where the plan's 8 would
    # answer 429 to an ordinary page load. This is not the limit on the database work of a
    # shop: the app has that itself (lib/limits.js): 4 API requests of a shop at a time, the
    # rest waiting up to 2 s for a turn and then 503, and 1 report per shop, 3 in all
    # (docs/multitenant-plan.md section 6).
    limit_conn pos_conn 24;
    limit_req_status 429;
    limit_conn_status 429;

    # Pilot only (docs/ops-runbook.md, the 401 sweep): uncomment to put a second password in
    # front of every shop until the app's own sign-in has been checked on the server.
    # auth_basic "POS";
    # auth_basic_user_file /etc/nginx/.htpasswd-pos;

    # Case-insensitive and with an optional final slash: wider than the app, which takes the
    # exact path only (lib/routing.js) and limits sign-ins per address itself too, so no
    # variant reaches the handler without a limit
    location ~* ^/api/auth/(login|password)/?$ {
        limit_req zone=pos_auth burst=5 nodelay;
        limit_req zone=pos_host burst=60 nodelay;
        include snippets/pos-proxy.conf;
    }

    # Static files only (no secrets in them, so compressing them is safe): the camera
    # decoder's wasm file is the largest thing a shop downloads
    location ~ ^/(css|js|vendor)/ {
        gzip on;
        gzip_types text/css application/javascript text/javascript application/wasm;
        limit_req zone=pos_host burst=60 nodelay;
        include snippets/pos-proxy.conf;
    }

    location / {
        limit_req zone=pos_host burst=60 nodelay;
        include snippets/pos-proxy.conf;
    }
}

# The admin panel: the exact name beats the shops' wildcard. Basic auth first, then the app's
# own password and TOTP code.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.pos.108-61-190-4.sslip.io;

    ssl_certificate /etc/nginx/pos-certs/$pos_cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/pos-certs/$pos_cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/pos.access.log;
    error_log /var/log/nginx/pos.error.log warn;
    server_tokens off;
    client_max_body_size 256k;
    limit_req_status 429;

    # Created by the owner himself (htpasswd -B, docs/ops-runbook.md); root:www-data 0640
    auth_basic "POS admin";
    auth_basic_user_file /etc/nginx/.htpasswd-pos-admin;

    # For an outside uptime check: the app answers /healthz only for Host localhost, with
    # nothing about any shop in it
    location = /healthz {
        auth_basic off;
        limit_req zone=pos_host burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_pass http://pos_app;
    }

    # Sign-in and the step-up code: 5 a minute per address. Case-insensitive, wider than the
    # app, which takes the exact path only and counts these per address itself too
    location ~* ^/api/admin/(auth|step-up) {
        limit_req zone=pos_admin_auth burst=3 nodelay;
        include snippets/pos-proxy.conf;
    }

    location / {
        limit_req zone=pos_host burst=60 nodelay;
        include snippets/pos-proxy.conf;
    }
}
