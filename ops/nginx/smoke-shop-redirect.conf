# Replacement content for /etc/nginx/sites-available/smoke-shop (docs/ops-runbook.md, step 14)
#
# The old single-shop address now sends people to the shop "smoke" on the new system. 302
# (temporary) for the first two weeks, so a mistake is not cached by browsers; after that,
# change 302 to 301 and reload. Same listen lines and certificate as before: the certificate
# stays in /etc/letsencrypt (renewed by the system's certbot.timer as it is today), and no
# password is asked any more, since the new shop has its own sign-in.
#
# Before installing, compare with the current file (kept in /root/backups): if it has
# ssl_* lines or an include (e.g. /etc/letsencrypt/options-ssl-nginx.conf, ssl_dhparam),
# copy them here unchanged. To go back: restore the saved file, nginx -t, reload.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smoke.108-61-190-4.sslip.io;

    ssl_certificate /etc/letsencrypt/live/smoke.108-61-190-4.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smoke.108-61-190-4.sslip.io/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    location / {
        return 302 https://smoke.pos.108-61-190-4.sslip.io$request_uri;
    }
}
